plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "org.lwjgl:lwjgl-vulkan:3.3.3"
	include "org.lwjgl:lwjgl-vulkan:3.3.3"

	implementation "org.lwjgl:lwjgl-shaderc:3.3.3"
	include "org.lwjgl:lwjgl-shaderc:3.3.3"

	runtimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
	include "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux"
	include "org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos"
	include "org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos"
}

// ВЗЛОМ ЛИМИТОВ: Заставляем Майнкрафт выделить 1 Мегабайт стека для драйвера Vulkan
loom {
	runs {
		client {
			vmArg "-Dorg.lwjgl.system.stackSize=1024"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}